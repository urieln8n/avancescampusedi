<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f2a44">
<title>Panel del taller · Avancés Campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: herramienta de trabajo: clara, rápida, botones grandes para usar con las manos ocupadas.
IDEA: el cuaderno del taller hecho app: pedidos, clientes, lona y gastos en un sitio.
PICTURE: el resumen con las cifras del mes y el tablero de pedidos por fases.
COLOUR and TYPE: azul marino de la lona, gris lona y verde de la etiqueta del taller; Barlow Condensed + Barlow.
LAYOUT: barra lateral en ordenador, pestañas abajo en el móvil; tarjetas y tablas que se apilan.
*/
:root{color-scheme:light dark;
  --bg:light-dark(#eef0f3,#0f141d);--card:light-dark(#fff,#18202c);--ink:light-dark(#141b29,#eef1f5);--soft:light-dark(#5b6474,#9fa9b8);
  --line:light-dark(#dde1e7,#273142);--navy:#1f2a44;--verde:#3f9c3a;--rojo:light-dark(#c62828,#ff6b6b);--ambar:light-dark(#9a6700,#f3c34b);--fondo2:light-dark(#f6f7f9,#141b26)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.1;margin:0 0 .4em}
h1{font-size:30px}h2{font-size:24px}h3{font-size:19px}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--verde);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn-2{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn-2:hover{border-color:var(--soft);filter:none}
.btn-rojo{background:transparent;color:var(--rojo);border:1.5px solid var(--line)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}

/* Estructura */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.lado{background:var(--navy);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.lado .marca{font:700 22px "Barlow Condensed",sans-serif;padding:4px 10px 16px}
.lado .marca small{display:block;font:500 13px Barlow,sans-serif;color:#b8c3d6}
.tab{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:#dfe5ee;cursor:pointer;text-align:left;font-weight:600}
.tab svg{width:20px;height:20px;flex:none}
.tab[aria-current=page]{background:#ffffff1f;color:#fff}
.tab:hover{background:#ffffff14}
.lado .pie{margin-top:auto;font-size:13px;color:#b8c3d6;padding:10px}
.main{padding:22px clamp(14px,3vw,32px) 90px;max-width:1300px}
.cab{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.cab h1{margin:0}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.tarjeta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.rejilla{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;color:var(--soft);font-size:14px;font-weight:500}
.kpi b{display:block;font:700 30px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.kpi small{color:var(--soft);font-size:13px}
.kpi.bien b{color:var(--verde)}.kpi.mal b{color:var(--rojo)}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.barra{display:grid;grid-template-columns:130px minmax(0,1fr) 40px;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.barra i{display:block;height:12px;border-radius:6px;background:var(--navy)}
.barra em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.meses{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:170px;margin-top:8px}
.mes{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px;color:var(--soft)}
.mes .pila{display:flex;gap:3px;align-items:flex-end;height:130px}
.mes .pila i{width:14px;border-radius:4px 4px 0 0;background:var(--verde)}
.mes .pila i+i{background:var(--rojo)}
.ley{display:flex;gap:14px;font-size:13px;color:var(--soft);margin-top:6px}
.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lista{list-style:none;padding:0;margin:0}
.lista li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.lista li:first-child{border-top:0}
.lista small{color:var(--soft)}
.vacio{color:var(--soft);font-size:14px;padding:6px 0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pos{color:var(--verde)}.neg{color:var(--rojo)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--fondo2);color:var(--soft);white-space:nowrap}
.chip.rojo{background:light-dark(#fde8e8,#3a1d1d);color:var(--rojo)}
.chip.ambar{background:light-dark(#fff3d6,#3b3218);color:var(--ambar)}
.chip.verde{background:light-dark(#e6f4e5,#1b2e1c);color:var(--verde)}

/* Tablero de pedidos */
.tablero{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{flex:0 0 270px;background:light-dark(#e3e7ec,#141b26);border-radius:12px;padding:10px;scroll-snap-align:start;min-height:120px}
.col.sobre{outline:3px dashed var(--verde)}
.col h3{display:flex;justify-content:space-between;font-size:17px;margin:2px 4px 10px}
.col h3 span{font:600 13px Barlow,sans-serif;color:var(--soft);background:var(--card);border-radius:20px;padding:1px 8px}
.ped{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.ped:hover{border-color:var(--soft)}
.ped b{display:block;font-size:16px}.ped span{display:block;color:var(--soft);font-size:14px}
.ped .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

/* Tablas */
.tabla{width:100%;border-collapse:collapse;font-size:15px}
.tabla th{text-align:left;font-size:13px;color:var(--soft);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
.tabla td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabla tr.clic{cursor:pointer}.tabla tr.clic:hover td{background:var(--fondo2)}
.tabla .num{text-align:right}
.buscar{min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);flex:1 1 220px;max-width:360px}

/* Formularios y ventanas */
.modal{position:fixed;inset:0;z-index:30;background:#0009;display:grid;place-items:center;padding:12px}
.caja{width:min(760px,100%);max-height:calc(100vh - 24px);overflow:auto;background:var(--bg);border-radius:16px;padding:20px clamp(14px,3vw,26px) 24px}
.caja .cab{position:sticky;top:-20px;background:var(--bg);padding-top:4px;z-index:2}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .ancho{grid-column:1/-1}
.fld{display:block}
.fld>span{display:block;font-size:14px;color:var(--soft);margin-bottom:4px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.fld textarea{min-height:84px;resize:vertical}
.fld input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--verde);vertical-align:middle}
.seccion{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.fases{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fases button{min-height:36px;padding:0 10px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.fases button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.cuentas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0}
.cuentas div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cuentas span{display:block;font-size:13px;color:var(--soft)}
.cuentas b{font:700 22px "Barlow Condensed",sans-serif}
.error{color:var(--rojo);font-weight:600;min-height:1.4em;margin:8px 0 0}
.aviso{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:40;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 8px 24px #0005;max-width:92vw}

/* Acceso */
.acceso{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--navy)}
.acceso .tarjeta{width:min(420px,100%)}
.acceso h1{color:var(--ink)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lado{position:fixed;inset:auto 0 0 0;height:auto;z-index:20;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0}
  .lado .marca,.lado .pie{display:none}
  .tab{flex-direction:column;gap:2px;min-height:52px;padding:4px 2px;font-size:11px;justify-content:center;text-align:center}
  .tab[data-v=ajustes]{display:none}
  .dos,.form{grid-template-columns:minmax(0,1fr)}
  .cuentas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .barra{grid-template-columns:110px minmax(0,1fr) 34px}
  .tabla.apila thead{display:none}
  .tabla.apila tr{display:grid;grid-template-columns:1fr auto;padding:10px 4px;border-bottom:1px solid var(--line)}
  .tabla.apila td{border:0;padding:2px 4px}
  .tabla.apila td.ocultar{display:none}
  .col{flex-basis:82vw}
}
</style>
</head>
<body>
<div id="raiz"></div>
<div id="modal" class="modal" hidden><div class="caja" id="caja" role="dialog" aria-modal="true"></div></div>
<div id="aviso" class="aviso" role="status" hidden></div>

<script>
{
/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (Number(n) || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 });
const eur0 = n => (Number(n) || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const nfmt = n => (Number(n) || 0).toLocaleString('es-ES', { maximumFractionDigits: 2 });
const hoy = () => new Date().toISOString().slice(0, 10);
const fCorta = f => { if (!f) return ''; const [a, m, d] = f.slice(0, 10).split('-'); return `${+d}/${+m}/${a.slice(2)}`; };
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function aviso(t) { const a = $('#aviso'); a.textContent = t; a.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(() => a.hidden = true, 2600); }

async function api(ruta, metodo = 'GET', cuerpo) {
  const r = await fetch('/api/' + ruta, { method: metodo, headers: { 'content-type': 'application/json', 'x-taller': '1' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined, credentials: 'same-origin' });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && ruta !== 'entrar') { mostrarAcceso(); throw new Error(d.error || 'Sesión caducada'); }
  if (!r.ok) throw new Error(d.error || 'Algo ha fallado');
  return d;
}
const FASES = [['nuevo', 'Presupuesto nuevo'], ['medidas', 'Medidas tomadas'], ['aceptado', 'Aceptado'], ['cortando', 'Cortando'], ['cosiendo', 'Cosiendo'], ['montaje', 'Montaje y prueba'], ['listo', 'Listo para entregar'], ['entregado', 'Entregado']];
const nomFase = id => (FASES.find(f => f[0] === id) || [, id])[1];
const CAT_GASTO = ['Material', 'Herramientas', 'Transporte y gasolina', 'Alquiler', 'Luz y agua', 'Seguros e impuestos', 'Publicidad', 'Otros'];
const METODOS = ['Efectivo', 'Bizum', 'Transferencia', 'Tarjeta'];
const UNIDADES = ['m', 'm²', 'ud', 'rollo', 'kg', 'caja'];
const AJ = { whatsapp: '34632083624', medidas: 'Longitud del carril (cm)\nAltura suelo-carril (cm)\nFondo del avancé (cm)\nAltura del lateral (cm)',
  aviso_medidas: 'Hola {nombre}: somos Avancés Campus. ¿Qué día podemos pasar por {lugar} a tomar las medidas de tu caravana?',
  aviso_aceptado: 'Hola {nombre}: confirmamos tu pedido ({trabajo}). Te avisamos en cuanto esté listo. Avancés Campus',
  aviso_montaje: 'Hola {nombre}: tu {trabajo} está terminado. ¿Qué día te va bien para el montaje en {lugar}? Avancés Campus',
  aviso_listo: 'Hola {nombre}: ¡tu {trabajo} ya está listo! ¿Cuándo te va bien la entrega? Avancés Campus',
  aviso_otro: 'Hola {nombre}, te escribimos de Avancés Campus sobre tu {trabajo}.' };
const ICONOS = {
  resumen: '<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
  pedidos: '<path d="M4 4h4v16H4zm6 0h4v10h-4zm6 0h4v13h-4z"/>',
  clientes: '<path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zM8 12a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm8 1c-2.7 0-8 1.3-8 4v3h16v-3c0-2.7-5.3-4-8-4zM8 14c-.3 0-.8 0-1.2.1A4.6 4.6 0 0 1 9 17v3H1v-2.5C1 15.3 5.4 14 8 14z"/>',
  materiales: '<path d="M21 7 12 2 3 7v10l9 5 9-5zM12 4.3 18.6 8 12 11.7 5.4 8zM5 9.7l6 3.4v6.6l-6-3.3zm8 10v-6.6l6-3.4v6.7z"/>',
  gastos: '<path d="M12 1a11 11 0 1 0 11 11A11 11 0 0 0 12 1zm1 17.9V20h-2v-1.1A4 4 0 0 1 8 15h2a2 2 0 0 0 2 2c1.1 0 2-.6 2-1.5 0-1-.9-1.4-2.5-1.9C9.7 13 8.3 12.3 8.3 10.3A3.5 3.5 0 0 1 11 7.1V6h2v1.1A3.7 3.7 0 0 1 15.7 10h-2a1.8 1.8 0 0 0-1.9-1.6c-1 0-1.8.5-1.8 1.4s.8 1.3 2.4 1.8c1.9.6 3.3 1.4 3.3 3.5a3.6 3.6 0 0 1-2.7 3.8z"/>',
  ajustes: '<path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.2 7.2 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.2 7.2 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.2 7.2 0 0 0 1.7 1L11 21h4l.4-2.9a7.2 7.2 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 3.5-3.5 3.5 3.5 0 0 1-3.5 3.5z"/>'
};
const VISTAS = [['resumen', 'Resumen'], ['pedidos', 'Pedidos'], ['clientes', 'Clientes'], ['materiales', 'Material'], ['gastos', 'Gastos'], ['ajustes', 'Ajustes']];

/* ================= Estado ================= */
let D = { clientes: [], pedidos: [], materiales: [], gastos: [], cobros: [], ajustes: { ...AJ } };
let vista = 'resumen', usuario = null, filtro = '';
async function cargar(...que) {
  const todas = que.length ? que : ['clientes', 'pedidos', 'materiales', 'gastos', 'cobros'];
  const r = await Promise.all(todas.map(t => api(t)));
  todas.forEach((t, i) => D[t] = r[i]);
}
async function cargarAjustes() { D.ajustes = { ...AJ, ...(await api('ajustes')) }; }

/* ================= Acceso ================= */
async function iniciar() {
  try {
    const e = await (await fetch('/api/estado', { credentials: 'same-origin' })).json();
    if (e.usuario) { usuario = e.usuario; await Promise.all([cargar(), cargarAjustes()]); pintarApp(); }
    else mostrarAcceso(e.hayUsuarios);
  } catch { $('#raiz').innerHTML = '<div class="acceso"><div class="tarjeta"><h1>Sin conexión</h1><p>No se puede conectar con el panel. Revisa internet y recarga.</p></div></div>'; }
}
function mostrarAcceso(hayUsuarios = true) {
  $('#modal').hidden = true;
  $('#raiz').innerHTML = `<div class="acceso"><form class="tarjeta" id="facc">
    <h1>${hayUsuarios ? 'Panel del taller' : 'Crear el primer acceso'}</h1>
    <p style="color:var(--soft);margin-top:0">${hayUsuarios ? 'Avancés Campus · entra con tu usuario.' : 'Pon el código de alta que te ha dado Andrés, tu nombre y una contraseña.'}</p>
    ${hayUsuarios ? '' : '<label class="fld"><span>Código de alta</span><input name="codigo" required autocomplete="off"></label>'}
    <label class="fld" style="margin-top:10px"><span>Nombre</span><input name="nombre" required autocomplete="username"></label>
    <label class="fld" style="margin-top:10px"><span>Contraseña${hayUsuarios ? '' : ' (mínimo 8)'}</span><input name="clave" type="password" required minlength="${hayUsuarios ? 1 : 8}" autocomplete="${hayUsuarios ? 'current-password' : 'new-password'}"></label>
    <p class="error" id="eacc"></p>
    <button class="btn" style="width:100%">${hayUsuarios ? 'Entrar' : 'Crear y entrar'}</button>
    ${hayUsuarios ? '<p style="font-size:14px;color:var(--soft)">¿Es tu primera vez? <a href="#" id="alta">Tengo un código de alta</a></p>' : ''}
    <p style="font-size:14px"><a href="/">‹ Volver a la web</a></p></form></div>`;
  $('#alta')?.addEventListener('click', ev => { ev.preventDefault(); mostrarAcceso(false); });
  $('#facc').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target));
    try { await api(hayUsuarios ? 'entrar' : 'alta', 'POST', f); iniciar(); }
    catch (e) { $('#eacc').textContent = e.message; }
  });
}

/* ================= Esqueleto ================= */
function pintarApp() {
  $('#raiz').innerHTML = `<div class="app">
    <nav class="lado" aria-label="Secciones">
      <div class="marca">Avancés Campus<small>Panel del taller</small></div>
      ${VISTAS.map(([v, n]) => `<button class="tab" data-v="${v}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONOS[v]}</svg>${n}</button>`).join('')}
      <div class="pie">Hola, ${esc(usuario)} · <a href="#" id="salir">Salir</a></div>
    </nav>
    <main class="main" id="main"></main></div>`;
  $('#salir').addEventListener('click', async ev => { ev.preventDefault(); await api('salir', 'POST'); location.reload(); });
  ir(location.hash.slice(1) || 'resumen');
}
function ir(v) {
  if (!VISTAS.some(x => x[0] === v)) v = 'resumen';
  vista = v; filtro = '';
  if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.v === v ? 'page' : 'false'));
  pintar(); scrollTo(0, 0);
}
function pintar() { ({ resumen: vResumen, pedidos: vPedidos, clientes: vClientes, materiales: vMateriales, gastos: vGastos, ajustes: vAjustes })[vista](); }
document.addEventListener('click', ev => { const t = ev.target.closest('.tab'); if (t) ir(t.dataset.v); });
addEventListener('hashchange', () => { if (usuario) ir(location.hash.slice(1)); });

/* ================= Resumen ================= */
async function vResumen() {
  const m = $('#main');
  m.innerHTML = `<div class="cab"><h1>Resumen</h1><div class="acciones"><button class="btn" data-a="pegar">Pegar pedido de WhatsApp</button><button class="btn btn-2" data-a="nuevo-pedido">+ Pedido</button><button class="btn btn-2" data-a="nuevo-gasto">+ Gasto</button></div></div><p class="vacio">Cargando…</p>`;
  let r; try { r = await api('resumen'); } catch (e) { m.querySelector('.vacio').textContent = e.message; return; }
  const [a, mm] = r.mes.split('-'); const nombreMes = MESES[+mm - 1];
  const beneficio = r.cobrado - r.gastado;
  const totalF = Math.max(1, ...r.fases.map(f => f.n));
  const meses = []; for (let i = 5; i >= 0; i--) { const d = new Date(+a, +mm - 1 - i, 1); meses.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`); }

    </section>
    <section class="tarjeta"><h2>Cobros y gastos · 6 meses</h2>
      <div class="meses">${meses.map(k => `<div class="mes" title="${k}: cobrado ${eur0(val(r.serie.cobros, k))}, gastado ${eur0(val(r.serie.gastos, k))}"><div class="pila"><i style="height:${val(r.serie.cobros, k) / maxM * 100}%"></i><i style="height:${val(r.serie.gastos, k) / maxM * 100}%"></i></div>${MESES[+k.slice(5) - 1]}</div>`).join('')}</div>
      <div class="ley"><span><i style="background:var(--verde)"></i>Cobrado</span><span><i style="background:var(--rojo)"></i>Gastado</span></div>

    </section>

let arrastra = null;

document.addEventListener('dragover', ev => { const c = ev.target.closest('.col'); if (c && arrastra) { ev.preventDefault(); document.querySelectorAll('.col.sobre').forEach(x => x !== c && x.classList.remove('sobre')); c.classList.add('sobre'); } });
document.addEventListener('drop', async ev => { const c = ev.target.closest('.col'); if (c && arrastra) { ev.preventDefault(); const p = D.pedidos.find(x => x.id === arrastra); arrastra = null; if (p && p.fase !== c.dataset.col) await cambiarFase(p, c.dataset.col); else pintar(); } });
document.addEventListener('dragend', () => { arrastra = null; document.querySelectorAll('.col.sobre').forEach(x => x.classList.remove('sobre')); });
async function cambiarFase(p, fase) {

/* ---- Ficha del pedido ---- */
function abrir(html) { $('#caja').innerHTML = html; $('#modal').hidden = false; $('#caja').querySelector('input,select,textarea')?.focus(); }
function cerrar() { $('#modal').hidden = true; $('#caja').innerHTML = ''; }
$('#modal').addEventListener('mousedown', ev => { if (ev.target.id === 'modal') cerrar(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#modal').hidden) cerrar(); });
const campo = (n, etq, v, tipo = 'text', extra = '') => `<label class="fld ${extra}"><span>${esc(etq)}</span><input name="${n}" type="${tipo}" value="${esc(v ?? '')}" ${tipo === 'number' ? 'step="any" inputmode="decimal"' : ''}></label>`;
const selector = (n, etq, v, ops, extra = '') => `<label class="fld ${extra}"><span>${esc(etq)}</span><select name="${n}">${ops.map(o => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v ?? '') ? 'selected' : ''}>${esc(txt)}</option>`; }).join('')}</select></label>`;
const medidasLista = () => String(D.ajustes.medidas || '').split('\n').map(s => s.trim()).filter(Boolean);

  <form id="fped" class="form">

    ${campo('trabajo', 'Trabajo', p.trabajo)}${campo('colores', 'Colores / tela', p.colores)}
    ${campo('estructura', 'Estructura', p.estructura)}${campo('montaje', 'Montaje', p.montaje)}
    ${campo('precio', 'Precio total (€)', p.precio || '', 'number')}${campo('fecha_entrega', 'Fecha comprometida', p.fecha_entrega, 'date')}
    ${campo('carril', 'Carril según el cliente (cm)', p.carril)}

    <form id="fcob" class="form" style="margin-top:8px">${campo('importe', 'Importe (€)', p.precio ? Math.max(0, p.precio - cobrado) || '' : '', 'number')}${selector('metodo', 'Método', 'Bizum', METODOS)}${selector('concepto', 'Concepto', cobrado ? 'Pago final' : 'Señal', ['Señal', 'Pago final', 'Pago parcial'])}${campo('fecha', 'Fecha', hoy(), 'date')}<div class="ancho"><button class="btn">+ Apuntar cobro</button></div></form></div>
  <div class="seccion"><h3>Material usado</h3>
    ${f.material.length ? `<ul class="lista">${f.material.map(m => `<li><span>${esc(m.nombre)}<br><small>${fCorta(m.fecha)}</small></span><span class="num">${nfmt(m.cantidad)} ${esc(m.unidad)} · ${eur(m.cantidad * m.coste_unit)}</span></li>`).join('')}</ul>` : '<p class="vacio">Todavía no has sacado material para este pedido.</p>'}
    ${D.materiales.length ? `<form id="fmat" class="form" style="margin-top:8px">${selector('material_id', 'Material', '', D.materiales.map(m => [m.id, `${m.nombre} (quedan ${nfmt(m.stock)} ${m.unidad})`]))}${campo('cantidad', 'Cantidad', '', 'number')}<div class="ancho"><button class="btn btn-2">− Sacar del stock para este pedido</button></div></form>` : '<p class="vacio">Da de alta tus materiales en la sección Material para controlar el gasto por pedido.</p>'}</div>

  <div class="seccion"><h3>Historial</h3><ul class="lista">${JSON.parse(p.historial || '[]').map(h => `<li><span>${esc(nomFase(h.fase))}</span><small>${fCorta(h.dia)}${h.por ? ' · ' + esc(h.por) : ''}</small></li>`).join('') || '<li class="vacio">Sin cambios todavía.</li>'}</ul></div>` : ''}`);

      let cid = fd.cliente_id;
      if (cid === '__nuevo') {
        if (!fd.n_nombre.trim()) throw new Error('Pon el nombre del cliente nuevo');

}
function enlaceAviso(p, cli) {
  const plantilla = D.ajustes['aviso_' + p.fase] || D.ajustes.aviso_otro;
  const t = plantilla.replace(/\{nombre\}/g, cli.nombre || '').replace(/\{trabajo\}/g, (p.trabajo || 'pedido').toLowerCase()).replace(/\{lugar\}/g, cli.lugar || 'tu camping');
  return `https://wa.me/34${encodeURIComponent(cli.telefono)}?text=${encodeURIComponent(t)}`;
}

/* ---- Pegar pedido de la web (código PTD1) ---- */
function decodificar(txt) {
  const m = String(txt).match(/PTD1-([A-Za-z0-9_-]+)/); if (!m) return null;
  try { const s = atob(m[1].replace(/-/g, '+').replace(/_/g, '/')); return JSON.parse(new TextDecoder().decode(Uint8Array.from(s, c => c.charCodeAt(0)))); } catch { return null; }
}
function abrirPegar() {
  abrir(`<div class="cab"><h2 style="margin:0">Pegar pedido de WhatsApp</h2><button class="btn btn-2 btn-sm" data-a="cerrar" aria-label="Cerrar">✕</button></div>
  <p>Copia el mensaje que te ha llegado desde el presupuesto de la web (o solo la línea que empieza por <b>PTD1-</b>) y pégalo aquí.</p>
  <label class="fld"><span>Mensaje</span><textarea id="pegado" rows="6"></textarea></label><p class="error" id="epeg"></p>
  <button class="btn" id="importar">Añadir al panel</button>`);
  $('#importar').addEventListener('click', async () => {
    const o = decodificar($('#pegado').value);
    if (!o || !o.nombre) { $('#epeg').textContent = 'No encuentro el código del pedido. Tiene que llevar «PTD1-».'; return; }
    try {
      const tel = String(o.telefono || '').replace(/\D/g, '');
      let cli = D.clientes.find(c => tel && c.telefono === tel);
      if (!cli) cli = { id: (await api('clientes', 'POST', { nombre: o.nombre, telefono: tel, lugar: o.lugar, vehiculo: o.vehiculo, modelo: o.modelo })).id };
      if (D.pedidos.some(p => p.cliente_id === cli.id && p.trabajo === o.trabajo && !p.archivado && p.fase !== 'entregado')) throw new Error('Este cliente ya tiene ese pedido en marcha.');
      const r = await api('pedidos', 'POST', { cliente_id: cli.id, trabajo: o.trabajo, colores: o.colores, estructura: o.estructura, montaje: o.montaje, carril: o.carril, notas: o.cuando ? 'Lo quiere: ' + o.cuando : '', fase: 'nuevo', origen: 'web', historial: [{ fase: 'nuevo', dia: hoy(), por: usuario }] });
      await cargar('clientes', 'pedidos'); aviso(`Pedido de ${o.nombre} añadido`); fichaPedido(r.id);
    } catch (e) { $('#epeg').textContent = e.message; }
  });
}

function fichaCliente(idc) {
  const c = D.clientes.find(x => x.id === idc) || {};
  const ps = D.pedidos.filter(p => p.cliente_id === idc);

function csv(tabla) {
  const filas = D[tabla]; if (!filas.length) { aviso('No hay datos'); return; }
  const cols = Object.keys(filas[0]);
  const txt = [cols.join(';'), ...filas.map(f => cols.map(c => `"${String(f[c] ?? '').replace(/"/g, '""')}"`).join(';'))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv' })); a.download = `avances-${tabla}-${hoy()}.csv`; a.click();
}
async function migrar() {
  let viejo = []; try { viejo = JSON.parse(localStorage.getItem('puntada-v1')).pedidos.filter(p => !p.ejemplo); } catch {}
  let n = 0;
  for (const o of viejo) {
    let cli = D.clientes.find(c => o.telefono && c.telefono === o.telefono);
    if (!cli) { cli = { id: (await api('clientes', 'POST', { nombre: o.nombre || 'Sin nombre', telefono: o.telefono, lugar: o.lugar, vehiculo: o.vehiculo, modelo: o.modelo })).id }; D.clientes.push({ ...cli, telefono: o.telefono }); }
    await api('pedidos', 'POST', { cliente_id: cli.id, trabajo: o.trabajo, colores: o.colores, estructura: o.estructura, montaje: o.montaje, carril: o.carril, medidas: o.medidas || {}, fase: o.fase || 'nuevo', fecha_entrega: o.fecha || '', notas: o.notas, origen: 'tablero', historial: o.historial || [], archivado: o.archivado ? 1 : 0 });
    n++;
  }
  await cargar('clientes', 'pedidos'); aviso(`${n} pedidos traídos al panel`); vAjustes();
}

/* ================= Acciones globales ================= */
document.addEventListener('click', async ev => {

    if (a === 'cerrar') return cerrar();
    if (a === 'pegar') return abrirPegar();

    if (a === 'nuevo-gasto') return fichaGasto(null);
    if (a === 'migrar') return migrar();
    if (a === 'ver-archivados') { ev.preventDefault(); return verArchivados(); }
    if (a === 'pedido-cliente') { const cid = $('#caja').dataset.id; await fichaPedido(null); $('#caja [name=cliente_id]').value = cid; return; }
    const idC = $('#caja')?.dataset.id;
    if (a === 'archivar-ped') { const p = D.pedidos.find(x => x.id === idC); await api('pedidos/' + idC, 'PUT', { archivado: p.archivado ? 0 : 1 }); await cargar('pedidos'); cerrar(); pintar(); return aviso(p.archivado ? 'Pedido recuperado' : 'Pedido archivado'); }
    if (a === 'borrar-ped') return confirmar('¿Borrar este pedido y sus cobros?', async () => { await api('pedidos/' + idC, 'DELETE'); await cargar('pedidos', 'cobros'); pintar(); });
    if (a === 'borrar-cli') return confirmar('¿Borrar este cliente?', async () => { await api('clientes/' + idC, 'DELETE'); await cargar('clientes'); pintar(); });
    if (a === 'borrar-mat') return confirmar('¿Borrar este material y su historial?', async () => { await api('materiales/' + idC, 'DELETE'); await cargar('materiales'); pintar(); });
    if (a === 'borrar-gas') return confirmar('¿Borrar este gasto?', async () => { await api('gastos/' + idC, 'DELETE'); await cargar('gastos'); pintar(); });
    const ped = t.closest('[data-ped]'); if (ped) { ev.preventDefault(); return fichaPedido(ped.dataset.ped); }
    const cli = t.closest('[data-cli]'); if (cli) return fichaCliente(cli.dataset.cli);
    const mat = t.closest('[data-mat]'); if (mat) return fichaMaterial(mat.dataset.mat);
    const gas = t.closest('[data-gas]'); if (gas) return fichaGasto(gas.dataset.gas);
    const mov = t.closest('[data-mov]'); if (mov) return movimiento(mov.dataset.mov, mov.dataset.id);
    const bc = t.closest('[data-borrar-cobro]'); if (bc) return confirmar('¿Borrar este cobro?', async () => { const pid = $('#caja').dataset.id; await api('cobros/' + bc.dataset.borrarCobro, 'DELETE'); await cargar('pedidos', 'cobros'); fichaPedido(pid); }, true);

  $('#caja').dataset.id = idPrev;
  $('#si').addEventListener('click', async () => { try { await si(); if (!volver) { cerrar(); aviso('Borrado'); } } catch (e) { aviso(e.message); } });
  $('#no').addEventListener('click', () => { if (abierto && previo) { cerrar(); if (volver) fichaPedido(idPrev); } else cerrar(); });
}
function verArchivados() {
  const ps = D.pedidos.filter(p => p.archivado);
  abrir(`<div class="cab"><h2 style="margin:0">Pedidos archivados</h2><button class="btn btn-2 btn-sm" data-a="cerrar" aria-label="Cerrar">✕</button></div><ul class="lista">${ps.map(p => `<li><a href="#" data-ped="${esc(p.id)}">${esc(p.cliente || 'Sin cliente')} · ${esc(p.trabajo || '')}</a><span class="num">${eur0(p.precio)}</span></li>`).join('')}</ul>`);
}

iniciar();
}
</script>
